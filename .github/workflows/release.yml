name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(python3 - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )

          IFS=. read -r major minor patch <<< "$current"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
          esac

          next="$major.$minor.$patch"

          python3 - "$next" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          with open('manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = version
          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: node tests/run.js

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version to v$VERSION"
          git push origin HEAD:main

      - name: Build production ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_dir="dist/steam-torrent-finder-v$VERSION"
          mkdir -p "$package_dir/icons"

          cp manifest.json background.js common.js content.js popup.html popup.js styles.css "$package_dir/"
          cp icons/icon16.png icons/icon48.png icons/icon128.png "$package_dir/icons/"

          (cd dist && zip -r -q "steam-torrent-finder-v$VERSION.zip" "steam-torrent-finder-v$VERSION")

          echo "ZIP=dist/steam-torrent-finder-v$VERSION.zip" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-torrent-finder-v${{ steps.version.outputs.version }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --title "Steam Torrent Finder v$VERSION" \
            --generate-notes
